# Sa7tein — API Worker (target migrasi dari Supabase). Lihat docs/backend/MIGRATION-cloudflare.md.
name = "sa7tein-api-cf"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "2f0537d984cb5f631c32505e08fa0f66"

# Versi kontrak API (dipakai FE untuk memilih sumber data; lihat docs/backend/MIGRATION-versioning.md)
[vars]
API_VERSION = "v2"
BACKEND = "cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "sa7tein"
database_id = "323b5ff6-c7c2-443e-8f99-42b43effbe3d"

[[kv_namespaces]]
binding = "KV"
id = "877bbe8a851142a6ae4b0fbeb1158ad6"

[[r2_buckets]]
binding = "R2_MENU"
bucket_name = "sa7tein-menu-images"

[[r2_buckets]]
binding = "R2_MERCHANT"
bucket_name = "sa7tein-merchant-photos"

[[r2_buckets]]
binding = "R2_AVATARS"
bucket_name = "sa7tein-avatars"

